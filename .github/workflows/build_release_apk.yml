name: Build & Release Android APK

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - 'README.md'
      - '.gitignore'
      - 'developerrequirement/**'
      - 'server/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 🎯 Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 📦 Install Flutter Dependencies
        run: flutter pub get

      - name: 🔨 Build Release APK
        run: flutter build apk --release

      - name: 🏷️ Generate Release Tag & Name
        id: vars
        run: |
          BUILD_TIME=$(date +'%Y%m%d-%H%M')
          echo "tag=v1.0.0-${BUILD_TIME}" >> $GITHUB_OUTPUT
          echo "release_name=Telso World Release v1.0.0 (${BUILD_TIME})" >> $GITHUB_OUTPUT

      - name: 🚀 Upload APK Artifact (Actions Run)
        uses: actions/upload-artifact@v4
        with:
          name: telsoworld-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: 📢 Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: ${{ steps.vars.outputs.release_name }}
          body: |
            ### 📱 Telso World Android Release
            - **Commit:** `${{ github.sha }}`
            - **Branch:** `${{ github.ref_name }}`
            - **Date:** $(date -u +'%Y-%m-%d %H:%M UTC')
            
            Download `app-release.apk` below and install it directly on your Android device.
          files: build/app/outputs/flutter-apk/app-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

